[package]
name = "ps3recover"
version = "0.1.0"
edition = "2021"
description = "Recover user data from a formatted PS3 internal hard drive"
license = "MIT"
repository = "https://github.com/crocdeine/ps3-data-recovery"

[dependencies]
aes = "0.8"
anyhow = "1"
cbc = "0.1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp"] }
rayon = "1"
tar = "0.4"
xts-mode = "0.5"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
