name: Release

# Run from the Actions tab (or the API): builds the programs for every
# system, then creates the tag and the GitHub release with them attached.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v0.1.0 (must match Cargo.toml)"
        required: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version matches Cargo.toml
        env:
          VERSION: ${{ inputs.version }}
        run: |
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$VERSION" != "v$crate" ]; then
            echo "::error::Requested $VERSION but Cargo.toml says $crate"
            exit 1
          fi

  build:
    needs: check
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, archive: ps3recover-linux-x86_64.tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: ps3recover-macos-apple-silicon.tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, archive: ps3recover-macos-intel.tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: ps3recover-windows-x86_64.zip }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test
        if: matrix.target != 'x86_64-apple-darwin'
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package (Linux and macOS)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release ps3recover
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/${{ matrix.target }}/release/ps3recover.exe -DestinationPath ${{ matrix.archive }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
